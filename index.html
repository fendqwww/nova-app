<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NOVA HANDS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NOVA HANDS">
<meta name="theme-color" content="#050506">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* один экран: камера в монохроме, поверх тонкая графика, снизу режимы */
:root{
  --ink:#050506;
  --steel:#8d96a0;
  --chrome:#e9edf1;
  --line:rgba(233,237,241,.9);
  --dim:rgba(233,237,241,.45);
  --glass:rgba(10,11,13,.55);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--chrome);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:var(--mono);font-size:12px}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{opacity:0;transition:opacity .8s}
#bg.on{opacity:1}

/* старт */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(120% 80% at 50% 40%,#16181c 0%,#050506 70%);z-index:5;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
.logo{font-family:var(--display);font-weight:800;line-height:.9;text-align:center;letter-spacing:.02em;font-size:clamp(44px,14vw,120px);
  background:linear-gradient(180deg,#fbfcfd 0%,#c9ced4 38%,#5b6168 50%,#d7dbe0 62%,#8a9098 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.logo span{display:block;font-size:.5em;letter-spacing:.32em;margin-top:.25em}
.logo::after{content:"";position:absolute;left:-10%;top:48%;width:120%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 45%,#fff 50%,rgba(255,255,255,.9) 55%,transparent);animation:glint 3.2s ease-in-out infinite;opacity:.8}
@keyframes glint{0%,100%{transform:translateX(-30%);opacity:0}40%,60%{opacity:.9}50%{transform:translateX(30%)}}
.sub{max-width:300px;text-align:center;color:var(--dim);line-height:1.6;font-size:12px;letter-spacing:.04em}
#start{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,#fff,#c3c8ce);border:0;border-radius:2px;padding:16px 26px;cursor:pointer}
#start:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:1px solid #fff;outline-offset:3px}
#start[disabled]{opacity:.5}
#err{color:#d9b8a6;max-width:320px;text-align:center;line-height:1.5;min-height:1.5em}

/* интерфейс */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));letter-spacing:.18em;font-size:10px;color:var(--dim)}
.brand{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--chrome)}
.stat{text-align:right;line-height:1.7}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 118px);text-align:center;padding:0 24px;color:var(--chrome);font-size:12px;letter-spacing:.06em;transition:opacity .5s;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px,env(safe-area-inset-left));pointer-events:auto}
.tabs{display:flex;border:1px solid rgba(233,237,241,.28);border-radius:2px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);background:none;border:0;padding:12px 16px;cursor:pointer;position:relative}
.tab+.tab{border-left:1px solid rgba(233,237,241,.14)}
.tab[aria-pressed="true"]{color:#fff}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:1px;background:#fff}
.row{display:flex;gap:8px;min-height:34px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--chrome);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(233,237,241,.22);border-radius:2px;padding:9px 12px;cursor:pointer}
.chip[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.logo::after{animation:none}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div id="intro">
  <div class="logo">NOVA<span>HANDS</span></div>
  <div class="sub">рисуй щипком в воздухе, открывай окно между руками, тяни нити между пальцами</div>
  <button id="start" type="button">включить камеру</button>
  <div id="err" role="status"></div>
</div>

<div id="hud">
  <div class="top">
    <div class="brand">NOVA HANDS</div>
    <div class="stat"><div id="hands">0 РУК</div><div id="fps">— FPS</div></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="bar">
    <div class="row">
      <button class="chip" id="filter" type="button">фильтр: тепловизор</button>
      <button class="chip" id="ink" type="button" hidden>линия: радуга</button>
      <button class="chip" id="clear" type="button" hidden>стереть</button>
      <button class="chip" id="flip" type="button">камера</button>
    </div>
    <div class="tabs" role="group" aria-label="режим">
      <button class="tab" type="button" data-mode="frame" aria-pressed="true">окно</button>
      <button class="tab" type="button" data-mode="draw" aria-pressed="false">рисунок</button>
      <button class="tab" type="button" data-mode="web" aria-pressed="false">нити</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js?v=4"></script>
</body>
</html>
