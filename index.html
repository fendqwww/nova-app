<link rel="icon" href="icon-180.png">

<style>
/* один экран: камера в монохроме, поверх тонкая графика, снизу режимы */
:root{
  --ink:#050506;
  --steel:#8d96a0;
  --chrome:#e9edf1;
  --line:rgba(233,237,241,.9);
  --dim:rgba(233,237,241,.45);
  --glass:rgba(10,11,13,.55);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--chrome);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:var(--mono);font-size:12px}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:grayscale(1) brightness(.5) contrast(1.2);opacity:0;transition:opacity .8s}
#cam.on{opacity:1}
#cam.back{transform:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* старт */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(120% 80% at 50% 40%,#16181c 0%,#050506 70%);z-index:5;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
.logo{font-family:var(--display);font-weight:800;line-height:.9;text-align:center;letter-spacing:.02em;font-size:clamp(44px,14vw,120px);
  background:linear-gradient(180deg,#fbfcfd 0%,#c9ced4 38%,#5b6168 50%,#d7dbe0 62%,#8a9098 100%);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.logo span{display:block;font-size:.5em;letter-spacing:.32em;margin-top:.25em}
.logo::after{content:"";position:absolute;left:-10%;top:48%;width:120%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9) 45%,#fff 50%,rgba(255,255,255,.9) 55%,transparent);animation:glint 3.2s ease-in-out infinite;opacity:.8}
@keyframes glint{0%,100%{transform:translateX(-30%);opacity:0}40%,60%{opacity:.9}50%{transform:translateX(30%)}}
.sub{max-width:300px;text-align:center;color:var(--dim);line-height:1.6;font-size:12px;letter-spacing:.04em}
#start{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:linear-gradient(180deg,#fff,#c3c8ce);border:0;border-radius:2px;padding:16px 26px;cursor:pointer}
#start:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:1px solid #fff;outline-offset:3px}
#start[disabled]{opacity:.5}
#err{color:#d9b8a6;max-width:320px;text-align:center;line-height:1.5;min-height:1.5em}

/* интерфейс */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));letter-spacing:.18em;font-size:10px;color:var(--dim)}
.brand{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.22em;color:var(--chrome)}
.stat{text-align:right;line-height:1.7}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 118px);text-align:center;padding:0 24px;color:var(--chrome);font-size:12px;letter-spacing:.06em;transition:opacity .5s;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px,env(safe-area-inset-left));pointer-events:auto}
.tabs{display:flex;border:1px solid rgba(233,237,241,.28);border-radius:2px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);background:none;border:0;padding:12px 16px;cursor:pointer;position:relative}
.tab+.tab{border-left:1px solid rgba(233,237,241,.14)}
.tab[aria-pressed="true"]{color:#fff}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:1px;background:#fff}
.row{display:flex;gap:8px;min-height:34px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--chrome);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(233,237,241,.22);border-radius:2px;padding:9px 12px;cursor:pointer}
.chip[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.logo::after{animation:none}}
</style>

<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="fx"></canvas>

<div id="intro">
  <div class="logo">NOVA<span>HANDS</span></div>
  <div class="sub">рисуй в воздухе пальцем, открывай окно между руками, тяни нити между пальцами</div>
  <button id="start" type="button">включить камеру</button>
  <div id="err" role="status"></div>
</div>

<div id="hud">
  <div class="top">
    <div class="brand">NOVA HANDS</div>
    <div class="stat"><div id="hands">0 РУК</div><div id="fps">— FPS</div></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="bar">
    <div class="row">
      <button class="chip" id="filter" type="button">фильтр: цвет</button>
      <button class="chip" id="clear" type="button" hidden>стереть</button>
      <button class="chip" id="flip" type="button">камера</button>
    </div>
    <div class="tabs" role="group" aria-label="режим">
      <button class="tab" type="button" data-mode="frame" aria-pressed="true">окно</button>
      <button class="tab" type="button" data-mode="draw" aria-pressed="false">рисунок</button>
      <button class="tab" type="button" data-mode="web" aria-pressed="false">нити</button>
    </div>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "./lib/vision_bundle.mjs";

const $ = (s) => document.querySelector(s);
const video = $("#cam"), canvas = $("#fx"), ctx = canvas.getContext("2d");
const off = document.createElement("canvas"), octx = off.getContext("2d", { willReadFrequently: true });
const HINTS = {
  frame: "подними обе руки и разведи большой и указательный пальцы",
  draw: "вытяни указательный палец и веди. кулак стирает",
  web: "покажи обе руки ладонями к камере",
};
const FILTERS = ["цвет", "негатив", "тепло", "пиксель", "хром"];
let mode = "frame", filterIdx = 0, facing = "user", stream = null, landmarker = null;
let W = 0, H = 0, DPR = 1;

/* ---------- размеры ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* отображение как у object-fit: cover */
function coverRect() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { x: (W - dw) / 2, y: (H - dh) / 2, w: dw, h: dh };
}
const mirrored = () => facing === "user";
function toScreen(p, r) {
  const nx = mirrored() ? 1 - p.x : p.x;
  return { x: r.x + nx * r.w, y: r.y + p.y * r.h, z: p.z };
}
function drawVideo(c, r) {
  c.save();
  if (mirrored()) { c.translate(W, 0); c.scale(-1, 1); c.drawImage(video, W - r.x - r.w, r.y, r.w, r.h); }
  else c.drawImage(video, r.x, r.y, r.w, r.h);
  c.restore();
}

/* ---------- камера и модель ---------- */
async function openCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
  });
  video.srcObject = stream;
  video.classList.toggle("back", facing !== "user");
  await video.play();
}
async function loadModel() {
  const files = await FilesetResolver.forVisionTasks("./lib");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "./models/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { return await HandLandmarker.createFromOptions(files, opts("GPU")); }
  catch (e) { console.warn("gpu off", e); return await HandLandmarker.createFromOptions(files, opts("CPU")); }
}

$("#start").addEventListener("click", async () => {
  const btn = $("#start"), err = $("#err");
  btn.disabled = true; err.textContent = "";
  try {
    btn.textContent = "камера…";
    await openCamera();
    btn.textContent = "загрузка модели…";
    landmarker = await loadModel();
    video.classList.add("on"); $("#intro").classList.add("hide"); $("#hud").classList.add("on");
    setMode("frame");
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = "ещё раз";
    err.textContent = e && e.name === "NotAllowedError"
      ? "доступ к камере запрещён. разреши его в настройках safari для этого сайта"
      : "не получилось запустить: " + (e && (e.message || e.name) || e);
  }
});

/* ---------- кнопки ---------- */
function setMode(m) {
  mode = m;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  $("#filter").hidden = m !== "frame";
  $("#clear").hidden = m !== "draw";
  showHint(HINTS[m]);
}
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
$("#filter").addEventListener("click", () => { filterIdx = (filterIdx + 1) % FILTERS.length; $("#filter").textContent = "фильтр: " + FILTERS[filterIdx]; });
$("#clear").addEventListener("click", () => clearStrokes());
$("#flip").addEventListener("click", async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await openCamera(); } catch (e) { facing = "user"; await openCamera(); }
  smooth.length = 0;
});
let hintTimer = 0;
function showHint(t) { const h = $("#hint"); h.textContent = t; h.style.opacity = 1; clearTimeout(hintTimer); hintTimer = setTimeout(() => (h.style.opacity = 0), 5000); }

/* ---------- руки ---------- */
const smooth = []; // сглаженные точки по слотам
function smoothHands(raw) {
  // сопоставляем по запястью с прошлым кадром, чтобы руки не прыгали
  const out = [];
  const used = new Set();
  raw.forEach((pts) => {
    let best = -1, bd = 1e9;
    smooth.forEach((s, i) => { if (used.has(i) || !s) return; const d = Math.hypot(s[0].x - pts[0].x, s[0].y - pts[0].y); if (d < bd) { bd = d; best = i; } });
    let prev = best >= 0 && bd < 120 ? smooth[best] : null;
    if (best >= 0) used.add(best);
    const a = 0.7;
    out.push(pts.map((p, k) => prev ? { x: prev[k].x + (p.x - prev[k].x) * a, y: prev[k].y + (p.y - prev[k].y) * a } : { x: p.x, y: p.y }));
  });
  smooth.length = 0; out.forEach((o) => smooth.push(o));
  return out;
}
const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function extended(h, tip, pip) { return d2(h[tip], h[0]) > d2(h[pip], h[0]) * 1.12; }
function pointing(h) { return extended(h, 8, 6) && !extended(h, 12, 10) && !extended(h, 16, 14); }
function fist(h) { return !extended(h, 8, 6) && !extended(h, 12, 10) && !extended(h, 16, 14) && !extended(h, 20, 18); }
function handSize(h) { return d2(h[0], h[9]); }

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS = [4, 8, 12, 16, 20];

function drawSkeleton(h, alpha) {
  ctx.lineWidth = 1; ctx.strokeStyle = `rgba(233,237,241,${0.55 * alpha})`;
  ctx.beginPath();
  BONES.forEach(([a, b]) => { ctx.moveTo(h[a].x, h[a].y); ctx.lineTo(h[b].x, h[b].y); });
  ctx.stroke();
  h.forEach((p, i) => {
    const tip = TIPS.includes(i);
    ctx.fillStyle = tip ? `rgba(255,255,255,${alpha})` : `rgba(141,150,160,${alpha})`;
    ctx.fillRect(p.x - (tip ? 2 : 1.5), p.y - (tip ? 2 : 1.5), tip ? 4 : 3, tip ? 4 : 3);
  });
}

/* ---------- блик, бегущий по контуру ---------- */
function glintPath(points, t, closed) {
  const segs = []; let total = 0;
  const n = closed ? points.length : points.length - 1;
  for (let i = 0; i < n; i++) { const a = points[i], b = points[(i + 1) % points.length]; const l = d2(a, b); segs.push([a, b, l]); total += l; }
  if (!total) return;
  const len = Math.min(90, total * 0.18);
  const head = (t * 0.45 % 1) * total;
  ctx.save(); ctx.lineCap = "round";
  for (let k = 0; k < 14; k++) {
    const s0 = head - len * (k / 14), s1 = head - len * ((k + 1) / 14);
    const pa = along(segs, total, s0), pb = along(segs, total, s1);
    ctx.strokeStyle = `rgba(255,255,255,${(1 - k / 14) * 0.95})`; ctx.lineWidth = 2.2 - k * 0.1;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  ctx.restore();
}
function along(segs, total, s) {
  s = ((s % total) + total) % total;
  for (const [a, b, l] of segs) { if (s <= l) { const u = l ? s / l : 0; return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u }; } s -= l; }
  return segs[0][0];
}

/* ---------- режим ОКНО ---------- */
const THERMAL = (() => { // приглушённая палитра: ночь, сталь, песок, белый
  const stops = [[0,[8,10,16]],[0.3,[38,52,74]],[0.55,[96,116,134]],[0.75,[176,160,132]],[0.9,[222,206,178]],[1,[250,248,242]]];
  const lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) { const v = i / 255; let j = 0; while (j < stops.length - 2 && v > stops[j + 1][0]) j++;
    const [p0, c0] = stops[j], [p1, c1] = stops[j + 1]; const u = (v - p0) / (p1 - p0);
    for (let k = 0; k < 3; k++) lut[i * 3 + k] = c0[k] + (c1[k] - c0[k]) * u; }
  return lut;
})();
function paintFilter(r, poly) {
  const f = FILTERS[filterIdx];
  ctx.save();
  ctx.beginPath(); poly.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.closePath(); ctx.clip();
  if (f === "цвет") {
    drawVideo(ctx, r);
  } else if (f === "негатив") {
    drawVideo(ctx, r);
    ctx.globalCompositeOperation = "difference"; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, H);
  } else if (f === "хром") {
    drawVideo(ctx, r);
    ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 1; drawVideo(ctx, r);
    ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "#808080"; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "soft-light"; ctx.fillStyle = "rgba(150,175,205,.55)"; ctx.fillRect(0, 0, W, H);
  } else {
    const small = f === "пиксель" ? 64 : 200;
    const ow = small, oh = Math.max(1, Math.round(small * H / W));
    if (off.width !== ow || off.height !== oh) { off.width = ow; off.height = oh; }
    octx.save(); octx.setTransform(ow / W, 0, 0, oh / H, 0, 0); drawVideo(octx, r); octx.restore();
    const img = octx.getImageData(0, 0, ow, oh), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      let l = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
      if (f === "пиксель") { l = l > 150 ? 236 : l > 95 ? 150 : l > 50 ? 70 : 16; d[i] = l; d[i + 1] = l; d[i + 2] = l + 4; }
      else { l = Math.min(255, Math.max(0, (l - 30) * 1.35)) | 0; d[i] = THERMAL[l * 3]; d[i + 1] = THERMAL[l * 3 + 1]; d[i + 2] = THERMAL[l * 3 + 2]; }
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = f !== "пиксель";
    ctx.drawImage(off, 0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
  }
  ctx.restore();
}
let frameAlpha = 0, lastPoly = null;
function drawFrame(hands, r, t, dt) {
  hands.forEach((h) => drawSkeleton(h, 0.35));
  let poly = null;
  if (hands.length === 2) {
    const [L, R] = hands[0][0].x < hands[1][0].x ? hands : [hands[1], hands[0]];
    const open = (h) => d2(h[4], h[8]) > handSize(h) * 0.45;
    if (open(L) && open(R)) poly = [L[8], R[8], R[4], L[4]];
  }
  frameAlpha += ((poly ? 1 : 0) - frameAlpha) * Math.min(1, dt * 10);
  if (poly) lastPoly = poly;
  if (frameAlpha < 0.02 || !lastPoly) return;
  const p = lastPoly;
  ctx.globalAlpha = frameAlpha;
  paintFilter(r, p);
  // контур
  ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,.95)";
  ctx.beginPath(); p.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.closePath(); ctx.stroke();
  // засечки в углах
  p.forEach((q) => { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(q.x - 5, q.y - 5, 10, 10); });
  glintPath(p, t, true);
  // подпись
  const top = p[0].y < p[1].y ? p[0] : p[1];
  ctx.font = "600 10px 'JetBrains Mono', monospace"; ctx.fillStyle = "rgba(255,255,255,.9)";
  const area = Math.abs(p.reduce((s, a, i) => { const b = p[(i + 1) % 4]; return s + a.x * b.y - b.x * a.y; }, 0) / 2);
  ctx.fillText(`${FILTERS[filterIdx].toUpperCase()}  ·  ${Math.round(area / 100)} U²`, Math.min(p[0].x, p[1].x), top.y - 12);
  ctx.globalAlpha = 1;
}

/* ---------- режим РИСУНОК ---------- */
let strokes = []; const live = new Map(); let fistSince = 0, wipe = 0;
const LIFE = 7;
function clearStrokes() { wipe = 1; }
function drawDraw(hands, t, dt) {
  hands.forEach((h, i) => {
    drawSkeleton(h, 0.3);
    if (pointing(h)) {
      const tip = h[8];
      let s = live.get(i);
      if (!s) { s = { pts: [], born: t }; live.set(i, s); strokes.push(s); }
      const last = s.pts[s.pts.length - 1];
      if (!last || d2(last, tip) > 2) s.pts.push({ x: tip.x, y: tip.y, t });
      s.last = t;
      // курсор
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 9, 0, Math.PI * 2); ctx.stroke();
    } else {
      live.delete(i);
      ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(h[8].x, h[8].y, 5, 0, Math.PI * 2); ctx.stroke();
    }
  });
  for (const k of [...live.keys()]) if (k >= hands.length) live.delete(k);
  // кулак держим, чтобы стереть
  if (hands.some(fist)) { fistSince += dt; if (fistSince > 0.6 && strokes.length) { wipe = 1; fistSince = -10; } } else fistSince = 0;

  if (wipe > 0) { wipe -= dt * 2.5; if (wipe <= 0) { strokes = []; live.clear(); wipe = 0; } }
  const wipeMul = wipe > 0 ? wipe : 1;
  strokes = strokes.filter((s) => t - (s.last || s.born) < LIFE);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of strokes) {
    const pts = s.pts; if (pts.length < 2) continue;
    const age = t - (s.last || s.born);
    const a = Math.max(0, 1 - Math.max(0, age - LIFE + 2) / 2) * wipeMul;
    // мягкая тень и тонкая белая линия поверх
    for (const [w, col] of [[6, `rgba(0,0,0,${0.35 * a})`], [2.4, `rgba(255,255,255,${a})`]]) {
      ctx.lineWidth = w; ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) { const m = { x: (pts[i].x + pts[i + 1].x) / 2, y: (pts[i].y + pts[i + 1].y) / 2 }; ctx.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y); }
      ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y); ctx.stroke();
    }
    // блик бежит по свежей линии
    if (live.size && s === [...live.values()].find((v) => v === s)) glintPath(pts.slice(-60), t * 1.6, false);
  }
}

/* ---------- режим НИТИ ---------- */
function drawWeb(hands, t) {
  hands.forEach((h) => drawSkeleton(h, 0.8));
  if (hands.length < 2) return;
  const [A, B] = hands[0][0].x < hands[1][0].x ? hands : [hands[1], hands[0]];
  // слабая паутина все-ко-всем
  ctx.lineWidth = 0.6; ctx.strokeStyle = "rgba(233,237,241,.12)"; ctx.beginPath();
  TIPS.forEach((a) => TIPS.forEach((b) => { ctx.moveTo(A[a].x, A[a].y); ctx.lineTo(B[b].x, B[b].y); }));
  ctx.stroke();
  // главные нити палец к пальцу, провисают по-разному
  TIPS.forEach((k, i) => {
    const a = A[k], b = B[k];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + Math.sin(t * 2 + i) * 6 + d2(a, b) * 0.06;
    ctx.lineWidth = 1.1; ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();
    // искра бежит по нити
    for (let j = 0; j < 2; j++) {
      const u = ((t * 0.35 + i * 0.17 + j * 0.5) % 1);
      const x = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * mx + u * u * b.x;
      const y = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * my + u * u * b.y;
      ctx.fillStyle = "#fff"; ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
  });
  // расстояние между указательными
  const a = A[8], b = B[8];
  ctx.font = "600 10px 'JetBrains Mono', monospace"; ctx.fillStyle = "rgba(255,255,255,.85)";
  const cm = Math.round(d2(a, b) / ((handSize(A) + handSize(B)) / 2) * 9);
  ctx.fillText(`${cm} СМ`, (a.x + b.x) / 2 - 14, Math.min(a.y, b.y) - 16);
}

/* ---------- цикл ---------- */
let lastVideoTime = -1, lastT = performance.now(), fpsAcc = 0, fpsN = 0, hands = [];
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  const t = now / 1000;
  if (!landmarker || video.readyState < 2) return;
  const r = coverRect();
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    let res;
    try { res = landmarker.detectForVideo(video, now); } catch (e) { console.warn(e); res = null; }
    const raw = (res && res.landmarks || []).map((lm) => lm.map((p) => toScreen(p, r)));
    hands = smoothHands(raw);
    $("#hands").textContent = `${hands.length} ${hands.length === 1 ? "РУКА" : hands.length ? "РУКИ" : "РУК"}`;
  }
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 0.5) { $("#fps").textContent = `${Math.round(fpsN / fpsAcc)} FPS`; fpsAcc = 0; fpsN = 0; }

  ctx.clearRect(0, 0, W, H);
  if (mode === "frame") drawFrame(hands, r, t, dt);
  else if (mode === "draw") drawDraw(hands, t, dt);
  else drawWeb(hands, t);
}
window.__nova = { get hands() { return hands; }, get mode() { return mode; }, setMode, get strokes() { return strokes.length; } };
</script>
